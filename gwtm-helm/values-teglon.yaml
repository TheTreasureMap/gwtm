# Teglon-only deployment, on its own cluster (gwtm-deploy/teglon, ArgoCD app gwtm-teglon).
# Secrets come from the SealedSecret `teglon-secrets` in the teglon namespace (keys listed in values.yaml).
#
# On first install the database and data volume are empty. Build them once with the setup Job in
# gwtm-deploy (teglon/setup-job.yaml, about two hours). Until it finishes the API has no data and each
# ingest run fails.

global:
  namespace: teglon

frontend:
  enabled: false
fastapi:
  enabled: false
database:
  enabled: false
listeners:
  enabled: false
ingress:
  enabled: false

teglon:
  enabled: true
  host: teglon.treasuremap.space
  image:
    tag: "2.1.0"
  ingest:
    suspend: false
